# Shared terraform-docs configuration for every stack under infra/.
# Run scripts/terraform-docs.sh (or let pre-commit run it) to regenerate.
formatter: "markdown table"

version: ">= 0.25.1, < 1.0.0"

sections:
  show:
    - requirements
    - providers
    - modules
    - resources
    - data-sources
    - inputs
    - outputs

# Only the block between the markers is rewritten; the hand-written part of
# each README above it is left untouched.
output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  default: true
  description: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true
