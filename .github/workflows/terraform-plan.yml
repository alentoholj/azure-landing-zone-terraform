name: Terraform Plan

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    terraform-plan:
        name: Terraform Plan
        runs-on: ubuntu-latest
        environment: crp-caf

        permissions:
            contents: read
            id-token: write

        defaults:
            run:
                working-directory: infra/governance

        env:
            ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            ARM_USE_AZUREAD: "true"
            ARM_USE_CLI: "true"

            TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
            TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
            TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
            TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: "1.12.2"

            - name: Azure Login
              uses: azure/login@v3
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Terraform Init
              run: |
                  terraform init -input=false \
                    -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
                    -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
                    -backend-config="container_name=${TFSTATE_CONTAINER}" \
                    -backend-config="key=${TFSTATE_KEY}" \
                    -backend-config="use_cli=true"

            - name: Terraform Plan
              run: terraform plan -input=false -no-color
