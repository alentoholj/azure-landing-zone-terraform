name: Azure OIDC Authentication Test

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    azure-login:
        name: Test Azure Login
        runs-on: ubuntu-latest
        environment: crp-caf

        steps:
            - name: Azure Login
              uses: azure/login@v3
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Verify Azure Login
              run: |
                  az account show \
                    --query "{Subscription:name,TenantId:tenantId}" \
                    --output table
