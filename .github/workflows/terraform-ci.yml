name: Terraform CI

on:
    pull_request:
        branches:
            - main
        paths:
            - "infra/**"
            - ".github/workflows/terraform-ci.yml"
            - ".github/workflows/terraform-stack.yml"

    push:
        branches:
            - main
        paths:
            - "infra/**"
            - ".github/workflows/terraform-ci.yml"
            - ".github/workflows/terraform-stack.yml"

    workflow_dispatch:

permissions:
    contents: read

# Serialise runs per ref so two runs never fight over the state locks.
concurrency:
    group: terraform-${{ github.ref }}
    cancel-in-progress: false
jobs:
    governance:
        name: governance
        uses: ./.github/workflows/terraform-stack.yml
        with:
            stack: governance
        secrets: inherit
        permissions:
            contents: read
            id-token: write

    management:
        name: management
        needs: governance
        uses: ./.github/workflows/terraform-stack.yml
        with:
            stack: management
        secrets: inherit
        permissions:
            contents: read
            id-token: write
