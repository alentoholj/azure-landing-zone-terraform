name: Terraform Governance CI

on:
    pull_request:
        branches:
            - main
        paths:
            - "infra/governance/**"
            - ".github/workflows/terraform-ci.yml"

    push:
        branches:
            - main
        paths:
            - "infra/governance/**"
            - ".github/workflows/terraform-ci.yml"

    workflow_dispatch:

permissions:
    contents: read

# Serialise runs per ref so two plans never fight over the state lock.
concurrency:
    group: terraform-governance-${{ github.ref }}
    cancel-in-progress: false

env:
    TF_VERSION: "1.12.2"
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    WORKING_DIR: infra/governance

jobs:
    terraform-validate:
        name: Terraform Format & Validate
        runs-on: ubuntu-latest
        timeout-minutes: 10

        defaults:
            run:
                working-directory: ${{ env.WORKING_DIR }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Terraform Format
              run: terraform fmt -check -recursive -diff

            - name: Terraform Init
              run: terraform init -backend=false -lockfile=readonly

            - name: Terraform Validate
              run: terraform validate

    terraform-plan:
        name: Terraform Plan
        needs: terraform-validate
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: crp-caf

        # OIDC tokens are not issued to pull requests from forks.
        if: >-
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository

        permissions:
            contents: read
            id-token: write
            pull-requests: write

        defaults:
            run:
                working-directory: ${{ env.WORKING_DIR }}

        env:
            ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            ARM_USE_OIDC: "true"
            ARM_USE_AZUREAD: "true"

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: ${{ env.TF_VERSION }}
                  terraform_wrapper: false

            - name: Terraform Init
              env:
                  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
                  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
                  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
                  TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
              run: |
                  terraform init -lockfile=readonly \
                    -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
                    -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
                    -backend-config="container_name=${TFSTATE_CONTAINER}" \
                    -backend-config="key=${TFSTATE_KEY}" \
                    -backend-config="use_oidc=true"

            - name: Terraform Plan
              id: plan
              run: |
                  set +e
                  terraform plan -lock-timeout=5m -detailed-exitcode -out=tfplan
                  exit_code=$?
                  set -e
                  echo "exitcode=${exit_code}" >> "$GITHUB_OUTPUT"
                  # 0 = no changes, 2 = changes present, anything else = error
                  if [ "${exit_code}" -ne 0 ] && [ "${exit_code}" -ne 2 ]; then
                    exit "${exit_code}"
                  fi

            - name: Render plan
              run: terraform show -no-color tfplan > plan.txt

            - name: Publish plan to job summary
              run: |
                  {
                    echo "## Terraform Plan: \`${WORKING_DIR}\`"
                    echo ""
                    echo '```hcl'
                    head -c 60000 plan.txt
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Comment plan on pull request
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v8
              env:
                  PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
              with:
                  script: |
                      const fs = require('fs');
                      const marker = '<!-- terraform-plan:infra/governance -->';
                      const maxLength = 60000;

                      let plan = fs.readFileSync(`${process.env.WORKING_DIR}/plan.txt`, 'utf8');
                      if (plan.length > maxLength) {
                        plan = plan.substring(0, maxLength) + '\n\n... plan truncated, see the job summary for the full output ...';
                      }

                      const status = process.env.PLAN_EXITCODE === '2' ? 'changes detected' : 'no changes';
                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

                      const body = [
                        marker,
                        `### Terraform Plan: \`infra/governance\` (${status})`,
                        '',
                        '<details><summary>Show plan</summary>',
                        '',
                        '```hcl',
                        plan,
                        '```',
                        '',
                        '</details>',
                        '',
                        `Commit: ${context.sha.substring(0, 7)} | [Workflow run](${runUrl})`,
                      ].join('\n');

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        per_page: 100,
                      });
                      const existing = comments.find(c => c.body && c.body.includes(marker));

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                        });
                      }
