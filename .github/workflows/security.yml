name: Security

# Static security checks. Nothing here talks to Azure.
#   zizmor: GitHub Actions workflows and Dependabot config (injection, unpinned actions, permissions)
#   tflint: Terraform lint rules and the azurerm ruleset
#   trivy:  Terraform misconfigurations, including the downloaded AVM modules
# Findings are uploaded to Security > Code scanning; the jobs fail on
# medium+ (zizmor), any issue (tflint) and HIGH/CRITICAL (trivy).
on:
    pull_request:
        branches:
            - main

    push:
        branches:
            - main

    # Weekly, so new checks in pinned tool versions or rule bundles surface
    # even when nothing in the repo changes.
    schedule:
        - cron: "0 6 * * 1"

    workflow_dispatch:

permissions:
    contents: read

# Tools are installed from GitHub releases and verified against the SHA-256
# pinned below (not against a checksum file from the same release). Dependabot
# does not update these: bump the version and the hash together by hand.
env:
    ZIZMOR_VERSION: "v1.32.0"
    ZIZMOR_SHA256: "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b"
    TFLINT_VERSION: "v0.66.0"
    TFLINT_SHA256: "22be11cadc25cd02401e94c0ccc91aa63467debb8485c2a755d98f4c0a9d1e2e"
    TRIVY_VERSION: "0.76.2"
    TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
    TF_VERSION: "1.12.2"

jobs:
    zizmor:
        name: Workflows (zizmor)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        permissions:
            contents: read
            security-events: write

        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Install zizmor
              working-directory: ${{ runner.temp }}
              run: |
                  archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
                  curl -fsSLO "https://github.com/zizmorcore/zizmor/releases/download/${ZIZMOR_VERSION}/${archive}"
                  echo "${ZIZMOR_SHA256}  ${archive}" | sha256sum --check --strict
                  mkdir -p bin
                  tar -xzf "${archive}" -C bin zizmor
                  echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

            # The token enables online audits, such as checking that every
            # pinned commit SHA really belongs to the action's repository.
            - name: Audit workflows (SARIF)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: zizmor --no-exit-codes --format sarif . > zizmor.sarif

            - name: Upload results to code scanning
              uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  sarif_file: zizmor.sarif
                  category: zizmor

            - name: Fail on medium or higher
              env:
                  GH_TOKEN: ${{ github.token }}
              run: zizmor --min-severity medium .

    tflint:
        name: Terraform lint (tflint)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Install tflint
              working-directory: ${{ runner.temp }}
              run: |
                  archive="tflint_linux_amd64.zip"
                  curl -fsSLO "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/${archive}"
                  echo "${TFLINT_SHA256}  ${archive}" | sha256sum --check --strict
                  mkdir -p bin
                  unzip -q "${archive}" -d bin
                  echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

            # Downloads the azurerm ruleset pinned in .tflint.hcl. The token
            # only avoids GitHub API rate limits.
            - name: Install plugins
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"

            - name: Lint all stacks
              run: tflint --recursive --chdir infra --config "${GITHUB_WORKSPACE}/.tflint.hcl"

    trivy:
        name: Terraform misconfigurations (trivy)
        runs-on: ubuntu-latest
        timeout-minutes: 15

        permissions:
            contents: read
            security-events: write

        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Install trivy
              working-directory: ${{ runner.temp }}
              run: |
                  archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
                  curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
                  echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
                  mkdir -p bin
                  tar -xzf "${archive}" -C bin trivy
                  echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: ${{ env.TF_VERSION }}
                  terraform_wrapper: false

            # The resources live in remote AVM modules, which trivy only scans
            # once they are downloaded. `terraform get` fetches modules only:
            # no providers, no backend, no Azure access.
            - name: Download modules
              run: |
                  for stack in infra/*/; do
                    [ -f "${stack}main.tf" ] || continue
                    terraform -chdir="${stack}" get -no-color
                  done

            - name: Scan (SARIF, all severities)
              run: trivy config --quiet --format sarif --output trivy.sarif infra

            - name: Upload results to code scanning
              uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  sarif_file: trivy.sarif
                  category: trivy

            - name: Fail on HIGH or CRITICAL
              run: trivy config --quiet --severity HIGH,CRITICAL --exit-code 1 infra
